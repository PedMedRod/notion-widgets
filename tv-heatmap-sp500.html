<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TradingView – SPX500 Heatmap</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #0b0f14;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      .tv {
        width: 100%;
        height: 100vh;
      }
      /* Opcional: ocultar la línea de copyright si TradingView la renderiza fuera (a veces no aplica) */
      .tradingview-widget-copyright { display: none; }
    </style>
  </head>

  <body>
    <div class="tv tradingview-widget-container">
      <div class="tradingview-widget-container__widget"></div>

      <script
        type="text/javascript"
        src="https://s3.tradingview.com/external-embedding/embed-widget-stock-heatmap.js"
        async
      >
      {
        "dataSource": "SPX500",
        "blockSize": "market_cap_basic",
        "blockColor": "change",
        "grouping": "sector",
        "locale": "en",
        "symbolUrl": "",
        "colorTheme": "dark",
        "exchanges": ["NASDAQ","NYSE"],
        "hasTopBar": false,
        "isDataSetEnabled": false,
        "isZoomEnabled": true,
        "hasSymbolTooltip": true,
        "isMonoSize": false,
        "width": "100%",
        "height": "100%"
      }
      </script>
    </div>
  </body>
</html>
