<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TradingView Events</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #ffffff;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      .tv {
        width: 100%;
        height: 100vh;
      }
    </style>
  </head>

  <body>
    <div class="tv tradingview-widget-container">
      <div class="tradingview-widget-container__widget"></div>

      <script
        type="text/javascript"
        src="https://s3.tradingview.com/external-embedding/embed-widget-events.js"
        async
      >
      {
        "colorTheme": "light",
        "isTransparent": false,
        "locale": "en",
        "countryFilter": "us,eu",
        "importanceFilter": "0,1",
        "width": "100%",
        "height": "100%"
      }
      </script>
    </div>
  </body>
</html>
