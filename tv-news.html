<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TradingView - Top Stories (Stocks)</title>

  <style>
    html, body{
      margin:0;
      padding:0;
      width:100%;
      height:100%;
      background: transparent;
      overflow:hidden;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    .card{
      width:100%;
      height:100%;
      min-height: 650px;           /* ✅ evita “blanco” por altura mínima */
      background:#fff;
      border: 1px solid rgba(0,0,0,.10);
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
      overflow:hidden;
      position:relative;
      box-sizing:border-box;
    }

    .tradingview-widget-container,
    .tradingview-widget-container__widget{
      width:100%;
      height:100%;
      min-height: 650px;           /* ✅ idem */
    }

    .tradingview-widget-copyright{
      position:absolute;
      left: 14px;
      bottom: 10px;
      font-size: 12px;
      opacity: .7;
      z-index: 2;
      background: rgba(255,255,255,.85);
      padding: 6px 10px;
      border-radius: 10px;
      backdrop-filter: blur(6px);
    }
    .tradingview-widget-copyright a{
      color:#111827;
      text-decoration:none;
    }
    .trademark{ color:#111827; }
  </style>
</head>

<body>
  <div class="card">
    <!-- TradingView Widget BEGIN -->
    <div class="tradingview-widget-container">
      <div class="tradingview-widget-container__widget"></div>

      <div class="tradingview-widget-copyright">
        <a href="https://www.tradingview.com/news/top-stories/" rel="noopener nofollow" target="_blank">
          Top stories
        </a>
        <span class="trademark"> by TradingView</span>
      </div>

      <script
        type="text/javascript"
        src="https://s3.tradingview.com/external-embedding/embed-widget-timeline.js"
        async
      >
      {
        "feedMode": "market",
        "market": "stock",
        "displayMode": "compact",
        "width": "100%",
        "height": "100%",
        "colorTheme": "light",
        "isTransparent": false,
        "locale": "en"
      }
      </script>
    </div>
    <!-- TradingView Widget END -->
  </div>
</body>
</html>
