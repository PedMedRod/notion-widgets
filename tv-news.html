<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TradingView - Top Stories (Stocks)</title>

  <style>
    html, body{
      margin:0;
      padding:0;
      width:100%;
      height:100%;
      background: transparent;
      overflow:hidden;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    .card{
      width:100%;
      height:100%;
      min-height:650px;
      background:#fff;
      border:1px solid rgba(0,0,0,.10);
      border-radius:18px;
      box-shadow:0 10px 30px rgba(0,0,0,.08);
      overflow:hidden;
      box-sizing:border-box;

      /* ✅ reserva espacio inferior para la atribución del widget */
      padding-bottom: 28px;
    }

    .tv-wrap{
      width:100%;
      height: calc(100% - 28px);
      min-height: calc(650px - 28px);
    }

    .tradingview-widget-container,
    .tradingview-widget-container__widget{
      width:100%;
      height:100%;
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="tv-wrap">
      <!-- TradingView Widget BEGIN -->
      <div class="tradingview-widget-container">
        <div class="tradingview-widget-container__widget"></div>

        <script
          type="text/javascript"
          src="https://s3.tradingview.com/external-embedding/embed-widget-timeline.js"
          async
        >
        {
          "feedMode": "market",
          "market": "stock",
          "displayMode": "compact",
          "width": "100%",
          "height": "100%",
          "colorTheme": "light",
          "isTransparent": false,
          "locale": "en"
        }
        </script>
      </div>
      <!-- TradingView Widget END -->
    </div>
  </div>
</body>
</html>
