<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HY OAS — ICE BofA US High Yield Option-Adjusted Spread</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    .contenedor {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }
    iframe {
      display: block;
      width: 100%;
      height: 525px;
      border: 0;
      overflow: hidden;
    }
    .pie {
      font-size: 12px;
      color: #6b7280;
      padding: 6px 4px 10px;
      text-align: right;
    }
    .pie a {
      color: #2563eb;
      text-decoration: none;
    }
    .pie a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="contenedor">
    <!--
      Grafico embebido de FRED.
      g=1YLSc  -> identificador del grafico configurado: serie BAMLH0A0HYM2,
                  rango desde 2023-09-19 hasta el ultimo dato disponible.
      Para cambiar de grafico basta con sustituir ese identificador.
    -->
    <iframe
      src="https://fred.stlouisfed.org/graph/graph-landing.php?g=1YLSc&width=900&height=475"
      scrolling="no"
      frameborder="0"
      allowTransparency="true"
      loading="lazy"
      title="ICE BofA US High Yield Index Option-Adjusted Spread">
    </iframe>

    <!-- Enlace de respaldo: si el iframe no carga, queda una via de acceso. -->
    <div class="pie">
      Fuente: ICE Data Indices via FRED ·
      <a href="https://fred.stlouisfed.org/series/BAMLH0A0HYM2" target="_blank" rel="noopener">
        abrir en FRED
      </a>
    </div>
  </div>

  <!--
    Script oficial de FRED: gestiona el redimensionado del iframe.
    Va al final del body. Si algun dia anades un segundo grafico a esta
    pagina, este script se incluye UNA sola vez.
  -->
  <script src="https://fred.stlouisfed.org/graph/js/embed.js" type="text/javascript"></script>
</body>
</html>
