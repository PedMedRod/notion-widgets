<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>TradingView – Economic Calendar</title>
    <style>
      html, body { margin: 0; padding: 0; background: #0b0f14; }
      .wrap { width: 100%; height: 100vh; }
      /* Opcional: evita scroll raro dentro del iframe */
      body { overflow: hidden; }
    </style>
  </head>
  <body>
    <!-- TradingView Widget BEGIN -->
    <div class="wrap tradingview-widget-container">
      <div class="tradingview-widget-container__widget"></div>
      <div class="tradingview-widget-copyright">
        <a href="https://www.tradingview.com/economic-calendar/" rel="noopener nofollow" target="_blank">
          <span class="blue-text">Economic Calendar</span>
        </a>
        <span class="trademark"> by TradingView</span>
      </div>
      <script
        type="text/javascript"
        src="https://s3.tradingview.com/external-embedding/embed-widget-events.js"
        async
      >
      {
        "colorTheme": "dark",
        "isTransparent": false,
        "locale": "en",
        "countryFilter": "us,eu",
        "importanceFilter": "0,1",
        "width": "100%",
        "height": "100%"
      }
      </script>
    </div>
    <!-- TradingView Widget END -->
  </body>
</html>
