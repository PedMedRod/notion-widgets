<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Notion Widget Wrapper</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #ffffff;
      }

      /* Evitar doble scroll externo */
      body { overflow: hidden; }

      .page {
        display: flex;
        justify-content: center;
        padding: 12px;
        box-sizing: border-box;
        background: #ffffff;
      }

      /* Controla ancho (modo lista) y alto visible en Notion */
      .frame {
        width: 420px;
        max-width: 100%;
        height: 900px; /* sube a 1100/1300 si quieres más lista visible */
        border: 1px solid rgba(0, 0, 0, 0.08);
        border-radius: 14px;
        overflow: hidden;
        background: #ffffff;
        display: block;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.08);
      }
    </style>
  </head>

  <body>
    <div class="page">
      <iframe
        class="frame"
        src="./tv-events.html"
        title="TradingView Economic Calendar"
        scrolling="no"
        loading="lazy"
      ></iframe>
    </div>
  </body>
</html>
