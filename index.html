<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Notion Widget Wrapper</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #0b0f14;
      }

      /* Evitar scroll externo */
      body { overflow: hidden; }

      /* Centramos el iframe interno */
      .page {
        display: flex;
        justify-content: center;
        padding: 8px;
        box-sizing: border-box;
      }

      /* AQUÍ controlas el layout real que “verá” TradingView */
      .frame {
        width: 420px;          /* fuerza modo lista */
        max-width: 100%;
        height: 900px;         /* alto visible en Notion */
        border: 0;
        border-radius: 12px;
        overflow: hidden;
        background: #0b0f14;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <iframe
        class="frame"
        src="./tv-events.html"
        title="TradingView Economic Calendar"
        scrolling="no"
        loading="lazy"
      ></iframe>
    </div>
  </body>
</html>
